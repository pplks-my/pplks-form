<title>PPLKS — Membership Application 入会申请</title>
<style>
  :root{
    --bg:#f5f6f8; --card:#ffffff; --ink:#241F21; --muted:#5b6673;
    --line:#e2e6ea; --accent:#C8102E;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#0f1216; --card:#171c22; --ink:#eef1f4; --muted:#98a3b0;
           --line:#242b33; --accent:#FF6B7D; }
  }
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    padding:24px; background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans SC","Microsoft YaHei",sans-serif;
  }
  .card{
    width:100%; max-width:420px; background:var(--card); border:1px solid var(--line);
    border-radius:16px; padding:32px 26px; text-align:center;
    box-shadow:0 1px 3px rgba(0,0,0,.06);
  }
  .mark{ width:150px; margin:0 auto 18px; background:#fff; border-radius:12px;
    padding:10px 12px; display:block; }
  .mark img{ display:block; width:100%; height:auto; }
  h1{ font-size:17px; line-height:1.4; margin:0 0 6px; font-weight:700; }
  .cn{ font-size:19px; margin:0 0 22px; font-weight:600; color:var(--ink); }
  .divider{ height:1px; background:var(--line); margin:22px 0; }
  .status{
    display:inline-block; padding:6px 14px; border-radius:999px; line-height:1;
    background:rgba(200,16,46,.10); color:var(--accent);
    font-size:13px; font-weight:600; margin-bottom:16px;
  }
  p{ font-size:14px; line-height:1.65; color:var(--muted); margin:0 0 10px; }
  .foot{ font-size:12px; color:var(--muted); margin-top:24px; }
</style>
</head>
